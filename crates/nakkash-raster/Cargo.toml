[package]
name = "nakkash-raster"
description = "Draws a frame's display list into pixels with vello_cpu: layers, paths, glyphs, blend modes and effects."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nakkash-format = { path = "../nakkash-format" }
kurbo.workspace = true
peniko.workspace = true
vello_cpu = { version = "0.4", default-features = false, features = [
  "std",
  "text",
  "u8_pipeline",
  "f32_pipeline",
] }
png = "0.18"
rayon.workspace = true
# 128-bit identities of what display-list nodes draw (D90).
siphasher = "1"
# The per-effect timing log (`nakkash::effect`, at debug level).
tracing.workspace = true
# JPEG pictures; PNG ones go through `png` (D37: both stay private).
zune-jpeg = "0.5"
# Glyph boxes, for the region of a projected layer of text.
skrifa.workspace = true
# The rasteriser's SIMD layer; `force_support_fallback` gives the portable
# scalar path that golden images are drawn with.
fearless_simd = { version = "1.2", features = ["force_support_fallback"] }
[dev-dependencies]
proptest.workspace = true
rstest.workspace = true

# `fearless_simd` is named to turn on its portable fallback; only tests call
# it, to force each instruction set in turn.
[package.metadata.cargo-machete]
ignored = ["fearless_simd"]

[lints]
workspace = true
