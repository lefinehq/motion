[package]
name = "motion-video"
description = "Reads video clips: the MP4 and QuickTime containers, decoders for the codecs footage uses (H.264 through the system's decoder), frame by frame with seeking."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
motion-format = { path = "../motion-format" }
# Photo JPEG frames; the same decoder pictures use.
zune-jpeg = "0.5"

# H.264 through the system's decoder (D13, D60).
[target.'cfg(target_os = "macos")'.dependencies]
motion-videotoolbox = { path = "../motion-videotoolbox" }

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
