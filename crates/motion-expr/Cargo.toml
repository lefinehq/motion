[package]
name = "motion-expr"
description = "Evaluates the expressions of imported projects with an embedded, deterministic JavaScript engine, and fits the samples back to editable keys."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["engine"]
# The JavaScript engine that evaluates expressions. Without it the crate is
# the host's vocabulary and the fit, which need no engine (D38).
engine = ["dep:boa_engine", "dep:boa_parser", "dep:boa_ast", "dep:boa_interner", "dep:libm"]

[dependencies]
motion-format = { path = "../motion-format" }
boa_engine = { workspace = true, optional = true }
boa_parser = { workspace = true, optional = true }
boa_ast = { workspace = true, optional = true }
boa_interner = { workspace = true, optional = true }
libm = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
rstest.workspace = true

[lints]
workspace = true
