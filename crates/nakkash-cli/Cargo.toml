[package]
name = "nakkash-cli"
description = "The `nakkash` command-line tool: check, query, edit and render nakkash scenes, and inspect `.aep` projects."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nakkash"
path = "src/main.rs"

[features]
# Learned models (D80): `nakkash ml`, which fetches models, previews and
# bakes. Off by default, so the default build links no inference runtime.
ml = [
  "dep:nakkash-baked",
  "dep:nakkash-format",
  "dep:nakkash-ml",
  "dep:nakkash-onnx",
  "dep:nakkash-video",
]

[dependencies]
nakkash-audio = { path = "../nakkash-audio" }
nakkash-encode = { path = "../nakkash-encode" }
nakkash-engine = { path = "../nakkash-engine", features = ["bake", "gpu"] }
nakkash-fonts = { path = "../nakkash-fonts", features = ["fetch"] }
# What a command cost, for `--stats` (D90).
nakkash-machine = { path = "../nakkash-machine" }
nakkash-baked = { path = "../nakkash-baked", optional = true }
nakkash-format = { path = "../nakkash-format", optional = true }
nakkash-ml = { path = "../nakkash-ml", features = ["fetch"], optional = true }
nakkash-onnx = { path = "../nakkash-onnx", optional = true }
nakkash-video = { path = "../nakkash-video", optional = true }
clap = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# Frame digests: `render --digest` (bit-for-bit comparison, nothing written).
sha2.workspace = true
strum.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
pretty_assertions.workspace = true
nakkash-format = { path = "../nakkash-format" }
sha2.workspace = true

[lints]
workspace = true
