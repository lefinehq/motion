[package]
name = "nakkash-cli"
description = "The `nakkash` command-line tool: check, query, edit and render nakkash scenes, and inspect `.aep` projects."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nakkash"
path = "src/main.rs"

[dependencies]
nakkash-audio = { path = "../nakkash-audio" }
nakkash-encode = { path = "../nakkash-encode" }
nakkash-engine = { path = "../nakkash-engine", features = ["bake"] }
nakkash-fonts = { path = "../nakkash-fonts", features = ["fetch"] }
clap = { workspace = true }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
pretty_assertions.workspace = true
nakkash-format = { path = "../nakkash-format" }

[lints]
workspace = true
