[package]
name = "nakkash-engine"
description = "Runs nakkash end to end: one session per scene file, the import of `.aep` projects, every step logged and timed, and the stderr subscriber that shows it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Bakes expressions at import (D38). Only the CLI turns it on.
bake = ["nakkash-import/bake"]

[dependencies]
glam.workspace = true
nakkash-format = { path = "../nakkash-format" }
nakkash-fonts = { path = "../nakkash-fonts" }
nakkash-scene = { path = "../nakkash-scene" }
nakkash-text = { path = "../nakkash-text" }
nakkash-query = { path = "../nakkash-query" }
nakkash-edit = { path = "../nakkash-edit" }
nakkash-import = { path = "../nakkash-import" }
nakkash-raster = { path = "../nakkash-raster" }
nakkash-audio = { path = "../nakkash-audio" }
nakkash-video = { path = "../nakkash-video" }
# Vector footage image layers draw (D70).
nakkash-vector = { path = "../nakkash-vector" }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
# Footage paths written relative to the scene that names them.
pathdiff = "0.2"
rayon.workspace = true

[dev-dependencies]
# The import tests bake.
nakkash-import = { path = "../nakkash-import", features = ["bake"] }
rstest.workspace = true
pretty_assertions.workspace = true
insta.workspace = true

[lints]
workspace = true
