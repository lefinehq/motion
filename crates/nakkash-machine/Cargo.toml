[package]
name = "nakkash-machine"
description = "What the machine a render runs on holds and how it is doing: its memory, its container's limit, memory pressure, and what the process used (D90). A platform binding with unsafe code (D48)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# The C library's calls for resource use and, on macOS, the kernel's
# variables (D48).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Not the workspace's lints: this crate may hold unsafe code (D48), and
# each block says why it is sound.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
