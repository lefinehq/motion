# Licence and advisory policy, checked in CI by `cargo deny check`.
# See https://embarkstudios.github.io/cargo-deny/ for the format.

[graph]
all-features = true
# The platforms nakkash is built for. Dependencies that only other
# configurations pull in (such as a codec's fuzzing harness under
# `cfg(fuzzing)`) are not part of any binary, so they are not checked.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
# Known vulnerabilities and unmaintained or yanked crates fail the check.
yanked = "deny"
ignore = [
  # `paste` is unmaintained, not unsafe: a finished macro crate that `rav1e`
  # uses at build time only. Drop this once `rav1e` moves off it.
  { id = "RUSTSEC-2024-0436", reason = "build-time macro of rav1e, unmaintained but sound" },
]

[licenses]
version = 2
# Permissive licences only: copyleft is not allowed (D13 in docs/design/decisions.md).
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
# Mozilla's root certificates, which the font fetcher's HTTP client trusts
# (D39), are data under a permissive data licence.
exceptions = [{ crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
