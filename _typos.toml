[files]
# Fixture projects and their snapshots hold the authors' own spelling.
extend-exclude = ["crates/motion-import/tests/fixtures/", "*.snap"]

[default.extend-words]
# Four-character chunk tags and short codes, not words.
als = "als"
fo = "fo"
jod = "jod"
pard = "pard"
pn = "pn"
rin = "rin"

[default]
# The curve fitting library `curve_fit_nd` (N-dimensional).
extend-ignore-re = ["curve[-_]fit[-_]nd"]
