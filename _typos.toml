[files]
# Fixture projects and their snapshots hold the authors' own spelling.
extend-exclude = ["crates/nakkash-import/tests/fixtures/", "*.snap"]

[default.extend-words]
# Four-character chunk and box tags and short codes, not words.
als = "als"
fo = "fo"
jod = "jod"
pard = "pard"
pn = "pn"
rin = "rin"
trak = "trak"
# PostScript language words: the deflate filter (as the PDF standard
# also names it) and a deferred structure comment.
atend = "atend"
flate = "flate"
# The PNG standard's predictor filter, named after Alan Paeth.
paeth = "paeth"

[default]
# The curve fitting library `curve_fit_nd` (N-dimensional).
extend-ignore-re = ["curve[-_]fit[-_]nd"]
