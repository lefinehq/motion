name: CI

# Pull requests run only the quick jobs (fmt, deny, hygiene) and merge into
# `development` after the contributor's local checks. The full Linux and macOS
# builds, tests and coverage run on each push to `development` and `main`, and
# `main` moves to a `development` commit only after they passed on it.
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/development' }}

jobs:
  check:
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Since rustup 1.28 `rustup show` no longer installs anything; this
      # installs the toolchain pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo nextest run --locked --workspace
      # nextest does not run doctests.
      - run: cargo test --locked --workspace --doc
      - name: Docs build without warnings
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Line coverage must stay at or above 85%. nakkash-gpu is left out of the
  # report: its code runs only on a GPU, which this runner lacks, and its
  # parity tests run against the CPU on a machine with one (D74).
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --exclude-from-report nakkash-gpu --fail-under-lines 85

  # Formatting, the one part of `check` that is quick enough for pull requests.
  fmt:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check

  # Licences, advisories, bans and sources, as configured in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Spelling, TOML formatting and unused dependencies.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,cargo-machete
      - run: taplo fmt --check
      - run: cargo machete
