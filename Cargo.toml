[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/lefinehq/nakkash"
# No crate is published yet; every crate inherits this with `publish.workspace`.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
glam = { version = "0.34", default-features = false, features = ["std", "f64"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
indexmap = { version = "2", features = ["serde"] }
winnow = "1"
proptest = "1"
insta = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
# Binary records of `.aep` projects (D30).
binrw = "0.15"
# `.mogrt` archives (D53): reading only, and only the deflate method.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# The pure Rust inflate behind it, the one the PNG decoder already uses.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "json",
] }
strum = { version = "0.28", features = ["derive"] }
derive_more = { version = "2", features = [
  "as_ref",
  "constructor",
  "deref",
  "display",
  "from",
  "into",
] }
kurbo = { version = "0.13", features = ["serde"] }
# Boolean operations on bézier outlines, on kurbo's own paths (D65).
linesweeper = { version = "0.5", default-features = false }
# Paint and font vocabulary shared with the rasteriser (D37).
peniko = { version = "0.6", default-features = false, features = ["std"] }
rstest = { version = "0.28", default-features = false }
pretty_assertions = "1"
# Text layout and shaping (D33). No system fonts: fonts come from given files.
parley = { version = "0.13", default-features = false, features = ["std"] }
# Parley's style vocabulary: the tags of font variations.
parlance = { version = "0.1", default-features = false, features = ["std"] }
# Font tables: names, metrics and glyph ids.
skrifa = "0.49"
# The font bytes type the shaper and the rasteriser share (D37: vocabulary).
linebender_resource_handle = "0.1"
# Content hashes of font files (D39).
sha2 = "0.10"
# jsDelivr lists file hashes in base64.
base64 = "0.23"
# The font fetcher's HTTP client, with Mozilla's root certificates so a
# fetch does not depend on the machine's trust store (D39).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The JavaScript engine that bakes expressions at import (D38), its parser
# and syntax tree for the operator rewrite. Never linked by what draws.
boa_engine = { version = "0.22", default-features = false }
boa_parser = "0.22"
boa_ast = "0.22"
boa_interner = "0.22"
# Vector footage (D70): a PDF page's objects and its drawing operators,
# interpreted into our own display list. Pure Rust, no embedded fonts or
# character maps: text in a font the file does not embed is reported.
hayro-syntax = "0.9"
hayro-interpret = { version = "0.9", default-features = false }
# Maths that gives the same bits on every platform, for baked keys.
libm = "0.2"
# The CPU rasteriser (D2, D34); here only to check that font data types agree.
vello_cpu = "0.4"

# Tests draw and encode real frames: the rasteriser, the shaper, the picture
# codecs and the AV1 encoder are compiled optimised even in debug builds, so a
# 1080x1920 golden frame takes milliseconds rather than minutes. Our own crates
# stay unoptimised for debugging.
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.parley]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.boa_engine]
opt-level = 3
[profile.dev.package.boa_parser]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.hayro-syntax]
opt-level = 3
[profile.dev.package.hayro-interpret]
opt-level = 3
[profile.dev.package.rav1e]
opt-level = 3
# The AV1 encoder is generic over its pixel type, so most of it is compiled
# where `nakkash-encode` names `u8`: that crate, a thin layer, is optimised too.
[profile.dev.package.nakkash-encode]
opt-level = 3
