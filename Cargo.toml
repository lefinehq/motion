[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/lefinehq/motion"
# No crate is published yet; every crate inherits this with `publish.workspace`.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
indexmap = { version = "2", features = ["serde"] }
winnow = "1"
proptest = "1"
insta = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
# Binary records of `.aep` projects (D30).
binrw = "0.15"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "json",
] }
strum = { version = "0.28", features = ["derive"] }
derive_more = { version = "2", features = [
  "as_ref",
  "constructor",
  "deref",
  "display",
  "from",
  "into",
] }
kurbo = { version = "0.13", features = ["serde"] }
rstest = { version = "0.28", default-features = false }
pretty_assertions = "1"
# Text layout and shaping (D33). No system fonts: fonts come from given files.
parley = { version = "0.13", default-features = false, features = ["std"] }
# Parley's style vocabulary: the tags of font variations.
parlance = { version = "0.1", default-features = false, features = ["std"] }
# Font tables: names, metrics and glyph ids.
skrifa = "0.49"
# The CPU rasteriser (D2, D34); here only to check that font data types agree.
vello_cpu = "0.4"

# Tests draw real frames: the rasteriser, the shaper and the PNG codec are
# compiled optimised even in debug builds, so a 1080x1920 golden frame takes
# milliseconds rather than minutes. Our own crates stay unoptimised for
# debugging.
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.parley]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
